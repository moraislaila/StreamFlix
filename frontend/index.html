<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoVision</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="cabecalho-site">
        <div class="perfil-cabecalho">
            <img id="fotoPerfil" class="avatar" src="./assets/logo/logo.jpg" alt="Foto do perfil">
            <div class="user-section oculto" id="userSection">
                <span id="nomeUsuario"></span>
                <button id="btnVerPerfil" class="btn-preto">Ver perfil</button>
            </div>
        </div>

        <h1 class="empresa">StreamFlix</h1>
        <button id="btnLogin" class="btn-preto">Entrar</button>
    </header>

    <main>
        <div class="busca">
            <input id="inputBusca" placeholder="Digite o nome do filme">
            <img src="assets/icones/lupa.svg" alt="Buscar" class="icone-lupa">
        </div>
        <div id="sessao" class="sessao"></div>
    </main>
    <footer>
        <span>StreamFlix</span>
        <div class="redes">
            <img src="./assets/icones/instagram.svg" alt="Instagram">
            <img src="./assets/icones/tiktok.svg" alt="Tiktok">
            <img src="./assets/icones/linkedin.svg" alt="Linkedin">
            <img src="./assets/icones/youtube.svg" alt="Youtube">
        </div>
        <span>Copyright© 2026-2027</span>
    </footer>

    <!-- Modal de login -->
    <dialog id="modalLogin" class="overlay oculto">
        <div class="modal">
            <div class="modal-topo">
                <h2>Login</h2>
                <button id="fecharModal" class="btn-fechar">x</button>
            </div>
            <input type="text" id="loginUsuario" placeholder="Digite seu nome_usuario">
            <span id="erroUsuario" class="erro"></span>
            <input type="password" id="loginSenha" placeholder="Digite sua senha">
            <span id="erroSenha" class="erro"></span>
            <span id="erroLogin" class="erro"></span>
            <div class="modal-botoes">
                <button id="btnCancelar" class="btn-outline">Cancelar</button>
                <button id="btnConfirmarLogin" class="btn-preto">Login</button>
            </div>
        </div>
    </dialog>

    <!-- menu lateral de perfil -->
    <aside id="painelPerfil" class="painel-lateral oculto">
        <div class="painel-topo">
            <button id="fecharPainel" class="btn-fechar">x</button>
        </div>
        <p><span id="totalInteresses">128</span> Likes</p>
        <p><span id="totalAnuncios">7</span> Filmes</p>
        <button id="btnSeusFilmes" class="btn-destaque"> Seus Filmes</button>
    </aside>

    <dialog id="modalCadastro" class="modal-cadastro">
        <div class="modal-cadastro-topo">
            <h2>Cadastrar filme</h2>
            <button id="fecharModalCadastro" type="button" class="btn-fechar" aria-label="Fechar">×</button>
        </div>
            <form id="formCadastro" enctype="multipart/form-data" novalidate>
                <div class="grupo-input">
                    <label for="campoTitulo">Título do filme</label>
                    <input id="campoTitulo" name="titulo" placeholder="Ex.: interestelar" />
                    <span id="erroTitulo" class="msg-erro"></span>
                </div>

                <div class="grupo-input">
                    <label for="campoLocal">Gênero</label>
                    <input id="campoLocal" name="local" placeholder="Ex.:Ficção Cientifica " />
                    <span id="erroLocal" class="msg-erro"></span>
                </div>

                <div class="grupo-input">
                    <label for="campoImagem">Capa</label>
                    <input id="campoImagem" name="imagem" type="file" accept=".jpg,.jpeg,.png,.gif,.webp" />
                    <span id="erroImagem" class="msg-erro"></span>
                </div>

                <button type="submit" class="btn-preto">Cadastrar</button>
            </form>
    </dialog>

        <div id="listaAnunciosPerfil"></div>
    <!-- Modal de interesse (cliente sem login) -->
    <div id="modalInteresse" class="overlay oculto">
        <div class="modal">
            <div class="modal-topo">
                <h2>Tenho interesse</h2>
                <button id="fecharModalInteresse" class="btn-fechar">×</button>
            </div>
            <input id="interesseNome" placeholder="Seu nome" />
            <input id="interesseContato" placeholder="Telefone ou e-mail" />
            <span id="erroInteresse" class="erro"></span>
            <div class="modal-botoes">
                <button id="btnCancelarInteresse" class="btn-outline">
                    Cancelar
                </button>
                <button id="btnConfirmarInteresse" class="btn-preto">
                    Confirmar
                </button>
            </div>
        </div>
    </div>
    <div id="modalMensagem" class="overlay oculto">
        <div class="modal">
            <div class="modal-topo">
                <h2>Mensagem ao vendedor</h2>
                <button id="fecharModalMensagem" class="btn-fechar">×</button>
            </div>
            <input id="mensagemNome" placeholder="Seu nome" />
            <input id="mensagemContato" placeholder="Telefone ou e-mail" />
            <textarea id="mensagemTexto" placeholder="Escreva sua mensagem"></textarea>
            <span id="erroMensagem" class="erro"></span>
            <div class="modal-botoes">
                <button id="btnCancelarMensagem" class="btn-outline">Cancelar</button>
                <button id="btnEnviarMensagem" class="btn-preto">Enviar</button>
            </div>
        </div>
    </div>
    <script src="javascript.js"></script>
</body>

</html>
